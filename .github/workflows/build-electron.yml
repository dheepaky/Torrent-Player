name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      - name: Build Windows Electron executable
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: release/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      - name: Build Linux AppImage and DEB package
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            release/*.AppImage
            release/*.deb

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      - name: Build macOS DMG and ZIP
        run: npx electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-binaries
          path: |
            release/*.dmg
            release/*.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & sync to Android assets
        run: |
          npm run build
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v -keystore android/app/release.keystore -alias torrentplayer -keyalg RSA -keysize 2048 -validity 10000 -storepass torrentpass -keypass torrentpass -dname "CN=Torrent Player, OU=App, O=TorrentPlayer, L=US, S=CA, C=US"

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace --no-daemon || (echo "Retrying Gradle assembleRelease after 15s..." && sleep 15 && gradle assembleRelease --stacktrace --no-daemon)

      - name: Prepare APK for Release
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/release/*.apk release-android/Torrent-Player-v2.2.0.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-android/*.apk

  release:
    needs: [build-windows, build-linux, build-mac, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-binaries/*.exe
            linux-binaries/*.AppImage
            linux-binaries/*.deb
            mac-binaries/*.dmg
            mac-binaries/*.zip
            android-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
