<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#090c12" />
    </linearGradient>

    <!-- Magnet Amber Core -->
    <linearGradient id="magnetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Play Button Gold Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Wave Swarm Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base for High Contrast on both Light & Dark tabs -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="119" fill="none" stroke="#2A3447" stroke-width="2" />

  <!-- Magnetic Field Waves (Torrent Swarm P2P Streaming Waves) -->
  <g fill="none" stroke-linecap="round" opacity="0.85">
    <!-- Outer wave arc -->
    <path d="M 172 168 A 120 120 0 0 1 340 168" stroke="url(#waveGrad)" stroke-width="14" opacity="0.4" />
    <!-- Middle wave arc -->
    <path d="M 200 196 A 80 80 0 0 1 312 196" stroke="url(#waveGrad)" stroke-width="12" opacity="0.75" />
    <!-- Inner wave arc -->
    <path d="M 226 224 A 42 42 0 0 1 286 224" stroke="url(#waveGrad)" stroke-width="10" />
  </g>

  <!-- Horseshoe Magnet Body -->
  <g filter="url(#glow)">
    <!-- Main U-curve body -->
    <path d="M 136 248 
             V 312 
             C 136 378.27 189.73 432 256 432 
             C 322.27 432 376 378.27 376 312 
             V 248 
             H 316 
             V 312 
             C 316 345.14 289.14 372 256 372 
             C 222.86 372 196 345.14 196 312 
             V 248 
             Z" 
          fill="url(#magnetGrad)" />

    <!-- Left Pole - North (Silver/Red Accent) -->
    <rect x="136" y="176" width="60" height="66" rx="6" fill="#F1F5F9" />
    <path d="M 136 176 H 196 V 192 H 136 Z" fill="#EF4444" />

    <!-- Right Pole - South (Silver/Blue Accent) -->
    <rect x="316" y="176" width="60" height="66" rx="6" fill="#F1F5F9" />
    <path d="M 316 176 H 376 V 192 H 316 Z" fill="#3B82F6" />
  </g>

  <!-- Stream Video Play Triangle (Centered in Magnet Field) -->
  <g filter="url(#glow)">
    <!-- Ambient circle behind play icon -->
    <circle cx="256" cy="296" r="42" fill="#0B0E17" stroke="#F59E0B" stroke-width="3" opacity="0.9" />
    <!-- Triangle -->
    <polygon points="244,276 278,296 244,316" fill="url(#playGrad)" />
  </g>
</svg>
